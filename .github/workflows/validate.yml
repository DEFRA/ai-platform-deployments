name: Validate

on:
  # The App labels each pull request it opens; a label run would only repeat
  # the check on the same head, and no machine pull request has a review.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-desired-state:
    uses: DEFRA/ai-platform-workflows/.github/workflows/validate-desired-state.yml@v1
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
