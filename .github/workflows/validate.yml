name: Validate

on:
  # The check reads the pull request's labels and approvals as well as its
  # head (a human break-glass change needs the break-glass label and two
  # approvals, README), so a label or review change revalidates. The App
  # labels each pull request it opens; the concurrency group below keeps one
  # run per pull request, the newest, so those events cost no extra runs.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-desired-state:
    uses: DEFRA/ai-platform-workflows/.github/workflows/validate-desired-state.yml@v1
    secrets: inherit
    permissions:
      contents: read
      pull-requests: read
